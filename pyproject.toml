[project]
name = "namellm"
version = "0.1.0"
description = "Kaggle Name That LLM competition workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.15,<2",
    "bitsandbytes>=0.50,<0.51",
    "kaggle>=2.2.5,<2.3",
    "modelscope>=1.33,<2",
    "numpy>=2.4,<2.5",
    "pandas>=3.0.6,<3.1",
    "peft>=0.18,<0.19",
    "pyarrow>=26,<27",
    "scikit-learn>=1.9,<2",
    "scipy>=1.18,<1.19",
    "sentencepiece>=0.2.3,<0.3",
    "six>=1.17,<2",
    "torch==2.11.0+cu128",
    "transformers>=5.19,<5.20",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=7,<8",
    "matplotlib>=3.11,<4",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]

